<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8">
		<meta content="width=device-width, initial-scale=1" name="viewport">
		<meta content="scale" name="text-scale">
		<script>
		"use strict"
		// Apply the saved or system theme before paint so the first frame does not flash.
		try {
			const stored = localStorage.getItem("review-theme")
			const dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches
			document.documentElement.classList.toggle("dark", dark)
		} catch {
			// Storage can be blocked; the light theme is the fallback.
		}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-code="eager" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
