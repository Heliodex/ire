<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8">
		<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
		<meta content="scale" name="text-scale">
		<meta content="#111827" name="theme-color">
		<meta content="Ire" name="apple-mobile-web-app-title">
		<meta content="yes" name="apple-mobile-web-app-capable">
		<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style">
		<link href="/manifest.webmanifest" rel="manifest">
		<link href="/icon-192.png" rel="apple-touch-icon">
		<link href="/favicon.svg" rel="icon" type="image/svg+xml">
		<script>
		"use strict"
		// Apply the saved or system theme before paint so the first frame does not flash.
		try {
			const stored = localStorage.getItem("review-theme")
			const dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches
			document.documentElement.classList.toggle("dark", dark)
		} catch {
			// Storage can be blocked; the light theme is the fallback.
		}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-code="eager" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
